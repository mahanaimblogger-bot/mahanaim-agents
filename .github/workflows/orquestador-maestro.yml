name: Orquestador Maestro (Lote)
on:
  workflow_dispatch:
    inputs:
      libro:
        description: "Libro (ej: genesis)"
        required: true
      rango:    
        description: "Rango de capítulos (ej: 1-10 o 1,3,5)"
        required: true
        default: "1-3"

jobs:
  procesar-lote:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4
        
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Instalar dependencias
        run: npm install
        
      - name: Ejecutar Orquestador Maestro
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: "https://api.deepseek.com/v1/chat/completions"
          LLM_MODEL: "deepseek-chat"
        run: |
          node src/orquestador-maestro.js --libro=${{ github.event.inputs.libro }} --rango=${{ github.event.inputs.rango }}
          
      - name: Subir Prompts como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompts-${{ github.event.inputs.libro }}-${{ github.event.inputs.rango }}
          path: prompts_output/
          retention-days: 30

      - name: Notificar éxito en Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🏁 Lote completado%0A Libro: ${{ github.event.inputs.libro }}%0A🔢 Rango: ${{ github.event.inputs.rango }}%0A Descarga los prompts desde los Artifacts."
            
      - name: Notificar fallo en Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Error en el Orquestador Maestro%0A📖 Libro: ${{ github.event.inputs.libro }}%0A🔢 Rango: ${{ github.event.inputs.rango }}%0A🔗 Ver detalles: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
