name: Orquestador Maestro (Lote)

on:
  workflow_dispatch:
    inputs:
      libro:
        description: 'Libro bíblico (ej: numeros, genesis, romanos)'
        required: true
        type: string
      rango:
        description: 'Capítulo o rango (ej: 7, 1-5, 12)'
        required: true
        type: string
      indicaciones:
        description: 'Indicaciones especiales / Notas del autor (Opcional)'
        required: false
        type: string
        default: 'SIN INDICACIONES ESPECIALES'

jobs:
  ejecutar-orquestador:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Orquestador Maestro
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔍 Verificando que las variables lleguen al script..."
          echo "SUPABASE_URL está configurada: $([[ -n '$SUPABASE_URL' ]] && echo 'SÍ' || echo 'NO')"
          echo "SUPABASE_ANON_KEY está configurada: $([[ -n '$SUPABASE_ANON_KEY' ]] && echo 'SÍ (longitud: ${#SUPABASE_ANON_KEY})' || echo 'NO')"
          
          node src/orquestador-maestro.js \
            --libro="${{ github.event.inputs.libro }}" \
            --rango="${{ github.event.inputs.rango }}" \
            --indicaciones="${{ github.event.inputs.indicaciones }}"

      - name: Subir artefactos (Prompts generados)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompts-generados-${{ github.event.inputs.libro }}
          path: prompts_output/${{ github.event.inputs.libro }}/
