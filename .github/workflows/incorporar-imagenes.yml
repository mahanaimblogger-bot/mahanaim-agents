name: Incorporar imágenes al estudio

on:
  workflow_dispatch:
    inputs:
      libro:
        description: "Libro (ej: genesis)"
        required: true
      capitulo:
        description: "Capítulo (ej: 4)"
        required: true
      portada:
        description: "URL de la imagen de portada (opcional)"
        required: false
        default: ""
      imagenes:
        description: "URLs de imágenes de contenido, separadas por comas, en orden"
        required: false
        default: ""

jobs:
  incorporar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Incorporar imágenes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node src/cliIncorporarImagenes.js --libro=${{ github.event.inputs.libro }} --capitulo=${{ github.event.inputs.capitulo }} --portada="${{ github.event.inputs.portada }}" --imagenes="${{ github.event.inputs.imagenes }}"

      - name: Notificar éxito en Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🎨 Imágenes incorporadas correctamente%0A📖 Libro: ${{ github.event.inputs.libro }}%0A🔢 Capítulo: ${{ github.event.inputs.capitulo }}%0A👉 Recuerda aprobar y publicar el estudio cuando estés listo."

      - name: Notificar fallo en Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Error al incorporar imágenes%0A📖 Libro: ${{ github.event.inputs.libro }}%0A🔢 Capítulo: ${{ github.event.inputs.capitulo }}%0A🔗 Ver detalles: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
