name: Ensamblar Video

on:
  workflow_dispatch:
    inputs:
      libro:
        description: 'Libro (ej: genesis)'
        required: true
        type: string
      capitulo:
        description: 'Capítulo (ej: 22)'
        required: true
        type: string

jobs:
  ensamblar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Ensamblar video con FFmpeg
        run: |
          node video/ensamblar-video.js \
            "${{ inputs.libro }}" \
            "${{ inputs.capitulo }}"

      - name: Subir video final
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ inputs.libro }}-${{ inputs.capitulo }}
          path: prompts_output/${{ inputs.libro }}/Capitulo_${{ inputs.capitulo }}/video/video_final.mp4
