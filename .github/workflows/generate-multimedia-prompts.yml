name: Generar Prompts Multimedia NotebookLM

on:
  # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:
    inputs:
      book_slug:
        description: 'Slug del libro (ej: exodo, genesis)'
        required: true
        default: 'exodo'
      chapter_number:
        description: 'Número del capítulo (ej: 5)'
        required: true
        default: '5'

jobs:
  generate-prompts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install @supabase/supabase-js openai

      - name: Run Prompt Generator Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BOOK_SLUG: ${{ github.event.inputs.book_slug }}
          CHAPTER_NUMBER: ${{ github.event.inputs.chapter_number }}
        run: node scripts/generate-prompts.js
