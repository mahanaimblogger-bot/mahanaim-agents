name: Generar Prompts Multimedia NotebookLM

on:
  workflow_dispatch:
    inputs:
      book_slug:
        description: 'Slug del libro (ej: exodo, genesis)'
        required: true
        default: 'exodo'
      chapter_number:
        description: 'Número del capítulo (ej: 5)'
        required: true
        default: '5'

jobs:
  generate-prompts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # <-- Volvemos a 18 para evitar el error de WebSocket

      - name: Install dependencies
        run: npm install @supabase/supabase-js openai

      - name: Run Prompt Generator Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BOOK_SLUG: ${{ github.event.inputs.book_slug }}
          CHAPTER_NUMBER: ${{ github.event.inputs.chapter_number }}
        run: node scripts/generate-prompts.js

      - name: Upload prompts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prompts-notebooklm-${{ github.event.inputs.book_slug }}-${{ github.event.inputs.chapter_number }}
          path: prompts_output/
          retention-days: 30
