name: Generar estudio bíblico

on:
  workflow_dispatch:
    inputs:
      libro:
        description: "Libro (ej: genesis)"
        required: true
      capitulo:
        description: "Capítulo (ej: 4)"
        required: true
      regenerar:
        description: "¿Regenerar si ya existe un estudio para este capítulo? (true/false)"
        required: false
        default: "false"
      indicaciones:
        description: "Indicación especial para este capítulo (opcional)"
        required: false
        default: ""

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Generar el estudio
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
                    node src/cli.js --libro=${{ github.event.inputs.libro }} --capitulo=${{ github.event.inputs.capitulo }} --forzar=${{ github.event.inputs.regenerar }} --indicaciones="${{ github.event.inputs.indicaciones }}"

      - name: Subir el HTML generado como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estudio-generado
          path: output/*.html

      - name: Notificar éxito en Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ Estudio generado correctamente%0A📖 Libro: ${{ github.event.inputs.libro }}%0A🔢 Capítulo: ${{ github.event.inputs.capitulo }}%0A👉 Recuerda aprobarlo cuando lo hayas revisado."

      - name: Notificar fallo en Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Error al generar el estudio%0A📖 Libro: ${{ github.event.inputs.libro }}%0A🔢 Capítulo: ${{ github.event.inputs.capitulo }}%0A🔗 Ver detalles: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
