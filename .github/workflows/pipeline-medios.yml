name: Pipeline de Producción de Medios (Imágenes, Audio, Video)

on:
  workflow_dispatch:
    inputs:
      libro:
        description: "Libro bíblico (ej: genesis, numeros, romanos, filemon)"
        required: true
        type: string
      rango:
        description: "Capítulo o rango (ej: 1, 22, 1-5)"
        required: true
        type: string

jobs:
  produccion-medios:
    runs-on: ubuntu-latest
    steps:
      # ─────────────────────────────────────────
      # 0. Preparación
      # ─────────────────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del sistema (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Node
        run: |
          npm install
          npm install fluent-ffmpeg
          if [ -f audio-tts/package.json ]; then npm install --prefix audio-tts; fi
          if [ -f video/package.json ]; then npm install --prefix video; fi

      # ─────────────────────────────────────────
      # 1. Generar Imágenes (fal.ai)
      # ─────────────────────────────────────────
      - name: Paso 1 — Generar imágenes con fal.ai
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          echo "FAL_KEY=${FAL_KEY}" > .env
          node scripts/generar-imagenes.js "${{ inputs.libro }}" "${{ inputs.rango }}"
          rm .env

      # ─────────────────────────────────────────
      # 2. Generar Audio (Google TTS)
      # ─────────────────────────────────────────
      - name: Paso 2 — Generar audio con Google TTS
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOZ_TTS: es-US-Wavenet-C
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node audio-tts/generar-audio.js "prompts_output/${{ inputs.libro }}/Capitulo_${{ inputs.rango }}/guion_video_tts.ssml"

      # ─────────────────────────────────────────
      # 3. Ensamblar Video (FFmpeg)
      # ─────────────────────────────────────────
      - name: Paso 3 — Ensamblar video con FFmpeg
        run: |
          # 1. Forzar la creación de la carpeta de destino (¡CRUCIAL!)
          mkdir -p audio-tts

          # 2. Buscar y mover archivos de forma segura
          AUDIO_FILE=$(find . -name "guion_video_tts_final.mp3" -type f | head -1)
          TIMESTAMPS_FILE=$(find . -name "guion_video_tts_timestamps.json" -type f | head -1)

          echo "🔍 Audio encontrado en: $AUDIO_FILE"
          echo "🔍 Timestamps encontrados en: $TIMESTAMPS_FILE"

          if [ -n "$AUDIO_FILE" ]; then
            mv "$AUDIO_FILE" audio-tts/guion_video_tts_final.mp3
            echo "✅ Audio movido a audio-tts/"
          else
            echo "❌ No se encontró el archivo de audio para mover"
            exit 1
          fi

          if [ -n "$TIMESTAMPS_FILE" ]; then
            mv "$TIMESTAMPS_FILE" audio-tts/guion_video_tts_timestamps.json
            echo "✅ Timestamps movidos a audio-tts/"
          else
            echo "❌ No se encontró el archivo de timestamps para mover"
            exit 1
          fi

          # 3. VERIFICACIÓN VISUAL (Para saber exactamente qué hay en la carpeta)
          echo "📂 Contenido de la carpeta audio-tts/ antes de ensamblar:"
          ls -la audio-tts/

          # 4. Ejecutar el ensamblador
          echo "🎬 Iniciando ensamblaje de video..."
          node video/ensamblar-video.js "${{ inputs.libro }}" "${{ inputs.rango }}"

      # ─────────────────────────────────────────
      # 4. Subir resultado final como artefacto
      # ─────────────────────────────────────────
      - name: Subir artefactos finales (Video y Audio)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-final-${{ inputs.libro }}-${{ inputs.rango }}
          path: |
            prompts_output/${{ inputs.libro }}/Capitulo_${{ inputs.rango }}/video/video_final.mp4
            audio-tts/guion_video_tts_final.mp3
            audio-tts/guion_video_tts_timestamps.json
