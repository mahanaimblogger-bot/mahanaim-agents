name: Generar Audio (TTS)

on:
  workflow_dispatch:
    inputs:
      libro:
        description: 'Libro (ej: genesis)'
        required: true
        type: string
      capitulo:
        description: 'Capítulo (ej: 22)'
        required: true
        type: string

jobs:
  generar-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

        - name: Instalar dependencias (raíz)
        run: npm install

      - name: Instalar dependencias (audio-tts)
        run: npm install
        working-directory: audio-tts

      - name: Generar audio con Google TTS
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOZ_TTS: es-US-Wavenet-C
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node audio-tts/generar-audio.js \
            "prompts_output/${{ inputs.libro }}/Capitulo_${{ inputs.capitulo }}/guion_video_tts_google.ssml"

      - name: Subir audio + timestamps
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-${{ inputs.libro }}-${{ inputs.capitulo }}
          path: |
            audio-tts/guion_video_tts_final.mp3
            audio-tts/guion_video_tts_timestamps.json
