name: Pipeline Completo Mahanaim

on:
  workflow_dispatch:
    inputs:
      libro:
        description: 'Libro bíblico (ej: genesis, numeros, romanos)'
        required: true
        type: string
      rango:
        description: 'Capítulo o rango (ej: 22, 1-5, 12)'
        required: true
        type: string
      indicaciones:
        description: 'Indicaciones especiales / Notas del autor (Opcional)'
        required: false
        type: string
        default: 'SIN INDICACIONES ESPECIALES'

jobs:
  pipeline-completo:
    runs-on: ubuntu-latest
    steps:
      # ─────────────────────────────────────────
      # 0. Preparación
      # ─────────────────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      # ─────────────────────────────────────────
      # 1. Orquestador: estudio + recursos + prompts
      # ─────────────────────────────────────────
      - name: Paso 1 — Orquestador Maestro
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          LLM_BASE_URL: 'https://api.deepseek.com/v1/chat/completions'
          LLM_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node src/orquestador-maestro.js \
            --libro="${{ inputs.libro }}" \
            --rango="${{ inputs.rango }}" \
            --indicaciones="${{ inputs.indicaciones }}"

      # ─────────────────────────────────────────
      # 2. Imágenes (fal.ai)
      # ─────────────────────────────────────────
      - name: Paso 2 — Generar imágenes con fal.ai
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          node scripts/generar-imagenes.js \
            "${{ inputs.libro }}" \
            "${{ inputs.rango }}"

      # ─────────────────────────────────────────
      # 3. Audio (TTS)
      # ─────────────────────────────────────────
      - name: Paso 3 — Generar audio con Google TTS
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOZ_TTS: es-US-Wavenet-C
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node audio-tts/generar-audio.js \
            "prompts_output/${{ inputs.libro }}/Capitulo_${{ inputs.rango }}/guion_video_tts_google.ssml"

      # ─────────────────────────────────────────
      # 4. Ensamblar video
      # ─────────────────────────────────────────
      - name: Paso 4 — Ensamblar video con FFmpeg
        run: |
          node video/ensamblar-video.js \
            "${{ inputs.libro }}" \
            "${{ inputs.rango }}"

      # ─────────────────────────────────────────
      # 5. Subir todo como artefacto
      # ─────────────────────────────────────────
      - name: Subir artefactos finales
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-completo-${{ inputs.libro }}-${{ inputs.rango }}
          path: |
            prompts_output/${{ inputs.libro }}/
            audio-tts/guion_video_tts_final.mp3
            audio-tts/guion_video_tts_timestamps.json
